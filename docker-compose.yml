services:
  roderick-db:
    image: mysql:8.0
    container_name: roderick2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-adminpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flaskdb}
    volumes:
      - roderick-db-data:/var/lib/mysql
    networks:
      - red-roderick
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  roderick-api:
    build: .
    container_name: roderick-flask-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DB_HOST: roderick-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-adminpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flaskdb}
    networks:
      - red-roderick
    depends_on:
      devsecops-db:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: roderick-uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-roderick

  dozzle:
    image: amir20/dozzle:latest
    container_name: roderick-dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - red-roderick

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: roderick-proxy-manager
    restart: always
    ports:
      - "80:80"     # HTTP
      - "81:81"     # Admin Web Nginx Proxy Manager
      - "443:443"   # HTTPS
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-roderick
    depends_on:
      - roderick-api

networks:
  red-roderick:
    name: red-roderick

volumes:
  roderick-db-data:
    name: roderick-db-data
  roderick-uptime-kuma-data:
    name: roderick-uptime-kuma-data